version: '3.8'

services:
  talentscout-app:
    build: .
    container_name: talentscout-hiring-assistant
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_PATH=/app/data/talentscout.db
    volumes:
      - ./data:/app/data
      - ./.env:/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
